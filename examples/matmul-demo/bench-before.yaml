# 优化前：naive 矩阵乘法
project: matmul-demo
benchmarks:
  - name: matmul
    kind: func
    command: build/bench_matmul.exe --benchmark_filter=BM_MatmulNaive --benchmark_repetitions=10 --benchmark_min_time=0.5s
  - name: app
    kind: prog
    command: build/app.exe naive
    repeat: 10
counters: [cycles, instructions, cache-misses, branch-misses]
