# 优化后：tiled 矩阵乘法（缓存分块）
project: matmul-demo
benchmarks:
  - name: matmul
    kind: func
    command: build/bench_matmul.exe --benchmark_filter=BM_MatmulTiled --benchmark_repetitions=10 --benchmark_min_time=0.5s
  - name: app
    kind: prog
    command: build/app.exe tiled
    repeat: 10
counters: [cycles, instructions, cache-misses, branch-misses]
