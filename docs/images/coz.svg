<svg xmlns='http://www.w3.org/2000/svg' width='820' height='440' viewBox='0 0 820 440'><rect x='0' y='0' width='820' height='440' rx='8' fill='#ffffff' fill-opacity='1.0' stroke='none' stroke-width='1.5'/><text x='410' y='30' font-size='18' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;' font-weight='bold'>Coz 因果剖析：不问“时间花在哪”，问“加速这行能带来多少收益”</text><line x1='90' y1='360' x2='760' y2='360' stroke='#333' stroke-width='1.5'/><polygon points='760,360 752.3,364.6 752.3,355.4' fill='#333'/><line x1='90' y1='360' x2='90' y2='70' stroke='#333' stroke-width='1.5'/><polygon points='90,70 94.6,77.7 85.4,77.7' fill='#333'/><text x='430' y='400' font-size='13' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>对某行代码施加的“虚拟加速”幅度 →</text><text x='70' y='210' font-size='13' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;' transform='rotate(-90 70 210)'>程序吞吐</text><polyline points='90.0,330.0 100.0,311.0 110.0,292.0 120.0,273.0 130.0,254.0 140.0,235.0 150.0,216.0 160.0,197.0 170.0,178.0 180.0,159.0 190.0,140.0 200.0,121.0 210.0,102.0 220.0,83.0 230.0,64.0 240.0,45.0 250.0,26.0 260.0,7.0 270.0,-12.0 280.0,-31.0 290.0,-50.0 300.0,-69.0 310.0,-88.0 320.0,-107.0 330.0,-126.0 340.0,-145.0 350.0,-164.0 360.0,-183.0 370.0,-202.0 380.0,-221.0 390.0,-240.0 400.0,-259.0 410.0,-278.0 420.0,-297.0 430.0,-316.0 440.0,-335.0 450.0,-354.0 460.0,-373.0 470.0,-392.0 480.0,-411.0 490.0,-430.0 500.0,-449.0 510.0,-468.0 520.0,-487.0 530.0,-506.0 540.0,-525.0 550.0,-544.0 560.0,-563.0 570.0,-582.0 580.0,-601.0 590.0,-620.0 600.0,-639.0 610.0,-658.0 620.0,-677.0 630.0,-696.0 640.0,-715.0 650.0,-734.0 660.0,-753.0 670.0,-772.0 680.0,-791.0 690.0,-810.0 700.0,-829.0' fill='none' stroke='#c0392b' stroke-width='2.5'/><text x='560' y='150' font-size='13' fill='#c0392b' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;' font-weight='bold'>关键路径上的行</text><text x='560' y='170' font-size='12' fill='#c0392b' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>优化它有真实收益</text><line x1='100' y1='300' x2='720' y2='300' stroke='#7f8c8d' stroke-width='2.5'/><text x='480' y='275' font-size='12' fill='#7f8c8d' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>非关键路径的行（可能很热但在空转等待）</text><text x='480' y='293' font-size='12' fill='#7f8c8d' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>优化它收益为零</text><circle cx='240' cy='45.0' r='4.5' fill='#c0392b' stroke='none' stroke-width='0'/><circle cx='390' cy='-240.0' r='4.5' fill='#c0392b' stroke='none' stroke-width='0'/><circle cx='540' cy='-525.0' r='4.5' fill='#c0392b' stroke='none' stroke-width='0'/><circle cx='690' cy='-810.0' r='4.5' fill='#c0392b' stroke='none' stroke-width='0'/><text x='410' y='55' font-size='11' fill='#3b6ea5' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>原理：要“虚拟加速”A 行，就在执行 A 行时令其他线程短暂停顿，再测吞吐变化</text><text x='410' y='70' font-size='11' fill='#3b6ea5' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>对每行 × 多个加速幅度做实验，拟合出“加速潜力曲线”</text></svg>