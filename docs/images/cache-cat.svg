xt><rect x='539' y='90' width='25' height='60' rx='3' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.2'/><text x='551' y='125' font-size='9' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>w17</text><rect x='566' y='90' width='25' height='60' rx='3' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.2'/><text x='578' y='125' font-size='9' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>w18</text><rect x='593' y='90' width='25' height='60' rx='3' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.2'/><text x='605' y='125' font-size='9' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>w19</text><rect x='80' y='88' width='322' height='64' rx='5' fill='none' fill-opacity='1.0' stroke='#27ae60' stroke-width='2.5'/><rect x='404' y='88' width='214' height='64' rx='5' fill='none' fill-opacity='1.0' stroke='#c0392b' stroke-width='2.5'/><rect x='80' y='190' width='300' height='80' rx='8' fill='#e9f7ef' fill-opacity='1.0' stroke='#27ae60' stroke-width='1.5'/><text x='230' y='212' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>COS0：延迟敏感业务（在线服务）</text><text x='230' y='228' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>CBM 掩码 = 1111_1111_1100...</text><text x='230' y='244' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>独占 12 个 way → 尾延迟有保障</text><rect x='440' y='190' width='300' height='80' rx='8' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.5'/><text x='590' y='212' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>COS1：批处理/后台任务</text><text x='590' y='228' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>CBM 掩码 = 0000_0000_0011...</text><text x='590' y='244' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>只用 8 个 way → 不污染邻居</text><rect x='80' y='300' width='660' height='70' rx='8' fill='#fbfcfe' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='100' y='322' font-size='11' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>实战（Linux resctrl）：mount -t resctrl resctrl /sys/fs/resctrl</text><text x='100' y='337' font-size='11' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>echo 'L3:0=fff;1=ff' &gt; /sys/fs/resctrl/COS0/schemata   # 先监控（CMT/MBM）再分区</text></svg>