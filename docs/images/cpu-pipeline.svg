/text><rect x='40' y='320' width='170' height='70' rx='8' fill='#e9f7ef' fill-opacity='1.0' stroke='#27ae60' stroke-width='1.5'/><text x='125' y='342' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>L1D</text><text x='125' y='358' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>32-48KB</text><text x='125' y='374' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>~4 周期</text><line x1='210' y1='355' x2='238' y2='355' stroke='#7f8c8d' stroke-width='1.5'/><polygon points='238,355 230.3,359.6 230.3,350.4' fill='#7f8c8d'/><rect x='240' y='320' width='170' height='70' rx='8' fill='#e8f0fa' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.5'/><text x='325' y='342' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>L2</text><text x='325' y='358' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>1-2MB</text><text x='325' y='374' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>~14 周期</text><line x1='410' y1='355' x2='438' y2='355' stroke='#7f8c8d' stroke-width='1.5'/><polygon points='438,355 430.3,359.6 430.3,350.4' fill='#7f8c8d'/><rect x='440' y='320' width='170' height='70' rx='8' fill='#fdf2e3' fill-opacity='1.0' stroke='#e67e22' stroke-width='1.5'/><text x='525' y='342' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>LLC</text><text x='525' y='358' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>30MB+ 共享</text><text x='525' y='374' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>~40-70 周期</text><line x1='610' y1='355' x2='638' y2='355' stroke='#7f8c8d' stroke-width='1.5'/><polygon points='638,355 630.3,359.6 630.3,350.4' fill='#7f8c8d'/><rect x='640' y='320' width='170' height='70' rx='8' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.5'/><text x='725' y='342' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>DRAM</text><text x='725' y='358' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>GB 级</text><text x='725' y='374' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>~200-300 周期</text><line x1='90' y1='320' x2='90' y2='155' stroke='#27ae60' stroke-width='1.5' stroke-dasharray='5 4'/><polygon points='90,155 94.6,162.7 85.4,162.7' fill='#27ae60'/><text x='100' y='240' font-size='11' fill='#7f8c8d' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;' transform='rotate(-90 100 240)'>Load 数据上行</text><text x='490' y='430' font-size='12' fill='#7f8c8d' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>前端受限 = 译码/取指供不上 μop；后端受限 = 有 μop 但缺数据或执行资源</text></svg>