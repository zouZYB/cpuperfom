<svg xmlns='http://www.w3.org/2000/svg' width='980' height='470' viewBox='0 0 980 470'><rect x='0' y='0' width='980' height='470' rx='8' fill='#ffffff' fill-opacity='1.0' stroke='none' stroke-width='1.5'/><text x='490' y='28' font-size='18' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;' font-weight='bold'>现代乱序超标量 CPU 流水线：前端供给 μop，后端乱序执行</text><rect x='20' y='60' width='150' height='90' rx='8' fill='#e8f0fa' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.5'/><text x='95' y='84' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>取指 Fetch</text><text x='95' y='100' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>I-Cache + 分支预测</text><text x='95' y='116' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>16B/周期</text><rect x='190' y='60' width='190' height='90' rx='8' fill='#e8f0fa' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.5'/><text x='285' y='80' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>译码供给 3 条路径</text><text x='285' y='95' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>MITE：传统译码器</text><text x='285' y='110' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>DSB：μop Cache</text><text x='285' y='125' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>LSD：循环缓冲</text><rect x='400' y='60' width='140' height='90' rx='8' fill='#fdf2e3' fill-opacity='1.0' stroke='#e67e22' stroke-width='1.5'/><text x='470' y='84' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>分配/重命名</text><text x='470' y='100' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Register Rename</text><text x='470' y='116' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>写入 ROB</text><rect x='560' y='60' width='120' height='90' rx='8' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.5'/><text x='620' y='84' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>ROB</text><text x='620' y='100' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>重排序缓冲</text><text x='620' y='116' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>200+ 项</text><rect x='700' y='60' width='120' height='90' rx='8' fill='#e9f7ef' fill-opacity='1.0' stroke='#27ae60' stroke-width='1.5'/><text x='760' y='84' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>调度器 RS</text><text x='760' y='99' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>按操作数就绪</text><text x='760' y='114' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>乱序挑选发射</text><rect x='830' y='55' width='130' height='32' rx='6' fill='#f6f9fd' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='895' y='76' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>P0  ALU/FMA</text><rect x='830' y='95' width='130' height='32' rx='6' fill='#f6f9fd' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='895' y='116' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>P1  ALU/FMA</text><rect x='830' y='135' width='130' height='32' rx='6' fill='#f6f9fd' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='895' y='156' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>P5  ALU/洗牌</text><rect x='830' y='175' width='130' height='32' rx='6' fill='#f6f9fd' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='895' y='196' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>P2/P3  Load</text><rect x='830' y='215' width='130' height='32' rx='6' fill='#f6f9fd' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='895' y='236' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>P4/P7  Store</text><rect x='830' y='255' width='130' height='32' rx='6' fill='#f6f9fd' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='895' y='276' font-size='11' f