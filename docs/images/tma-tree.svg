<svg xmlns='http://www.w3.org/2000/svg' width='920' height='560' viewBox='0 0 920 560'><rect x='0' y='0' width='920' height='560' rx='8' fill='#ffffff' fill-opacity='1.0' stroke='none' stroke-width='1.5'/><text x='460' y='30' font-size='18' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;' font-weight='bold'>TMA 自顶向下微架构分析：把所有流水线槽位分层归因</text><rect x='310' y='50' width='300' height='50' rx='8' fill='#f2f4f4' fill-opacity='1.0' stroke='#7f8c8d' stroke-width='1.5'/><text x='460' y='70' font-size='13' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Pipeline Slots（发射槽位）</text><text x='460' y='87' font-size='13' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>≈ 每周期 4 槽 × 核周期数</text><line x1='460' y1='100' x2='122' y2='135' stroke='#27ae60' stroke-width='1.5'/><polygon points='122,135 129.2,129.6 130.1,138.8' fill='#27ae60'/><rect x='30' y='135' width='185' height='64' rx='8' fill='#e9f7ef' fill-opacity='1.0' stroke='#27ae60' stroke-width='1.5'/><text x='122' y='156' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Retiring 退役</text><text x='122' y='172' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>真正完成有用功</text><text x='122' y='188' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>越高越好</text><line x1='460' y1='100' x2='347' y2='135' stroke='#c0392b' stroke-width='1.5'/><polygon points='347,135 353.0,128.3 355.7,137.2' fill='#c0392b'/><rect x='255' y='135' width='185' height='64' rx='8' fill='#fdedec' fill-opacity='1.0' stroke='#c0392b' stroke-width='1.5'/><text x='347' y='156' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Bad Speculation</text><text x='347' y='172' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>误预测/投机浪费</text><text x='347' y='188' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>分支误预测</text><line x1='460' y1='100' x2='572' y2='135' stroke='#e67e22' stroke-width='1.5'/><polygon points='572,135 563.3,137.1 566.0,128.3' fill='#e67e22'/><rect x='480' y='135' width='185' height='64' rx='8' fill='#fdf2e3' fill-opacity='1.0' stroke='#e67e22' stroke-width='1.5'/><text x='572' y='156' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Front-End Bound</text><text x='572' y='172' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>前端供给不足</text><text x='572' y='188' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>取指/译码停顿</text><line x1='460' y1='100' x2='797' y2='135' stroke='#8e44ad' stroke-width='1.5'/><polygon points='797,135 788.8,138.8 789.8,129.6' fill='#8e44ad'/><rect x='705' y='135' width='185' height='64' rx='8' fill='#f4ecf7' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.5'/><text x='797' y='156' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Back-End Bound</text><text x='797' y='172' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>后端资源不足</text><text x='797' y='188' font-size='12' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>等数据/等执行口</text><line x1='572' y1='199' x2='565' y2='235' stroke='#e67e22' stroke-width='1.5'/><polygon points='565,235 561.9,226.5 571.0,228.3' fill='#e67e22'/><rect x='480' y='235' width='170' height='58' rx='8' fill='#fef9f0' fill-opacity='1.0' stroke='#e67e22' stroke-width='1.2'/><text x='565' y='255' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Fetch Latency</text><text x='565' y='270' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>I-Cache/ITLB miss、分支重定向</text><line x1='572' y1='199' x2='745' y2='235' stroke='#e67e22' stroke-width='1.5'/><polygon points='745,235 736.5,238.0 738.4,228.9' fill='#e67e22'/><rect x='660' y='235' width='170' height='58' rx='8' fill='#fef9f0' fill-opacity='1.0' stroke='#e67e22' stroke-width='1.2'/><text x='745' y='255' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Fetch Bandwidth</text><text x='745' y='270' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>译码宽度限制 MITE/DSB 切换</text><line x1='797' y1='199' x2='790' y2='315' stroke='#8e44ad' stroke-width='1.5'/><polygon points='790,315 785.8,307.0 795.1,307.6' fill='#8e44ad'/><rect x='705' y='315' width='190' height='58' rx='8' fill='#f9f2fb' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.2'/><text x='800' y='335' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Memory Bound</text><text x='800' y='350' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>等内存数据（cache miss）</text><line x1='760' y1='199' x2='565' y2='315' stroke='#8e44ad' stroke-width='1.5'/><polygon points='565,315 569.3,307.1 574.0,315.0' fill='#8e44ad'/><rect x='480' y='315' width='190' height='58' rx='8' fill='#f9f2fb' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.2'/><text x='575' y='335' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>Core Bound</text><text x='575' y='350' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>端口争用/长延迟运算</text><rect x='620' y='400' width='135' height='44' rx='6' fill='#ffffff' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.0'/><text x='687' y='427' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>L1 Bound</text><rect x='765' y='400' width='135' height='44' rx='6' fill='#ffffff' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.0'/><text x='832' y='427' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>L2 Bound</text><rect x='620' y='456' width='135' height='44' rx='6' fill='#ffffff' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.0'/><text x='687' y='483' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>L3/LLC Bound</text><rect x='765' y='456' width='135' height='44' rx='6' fill='#ffffff' fill-opacity='1.0' stroke='#8e44ad' stroke-width='1.0'/><text x='832' y='483' font-size='11' fill='#222' text-anchor='middle' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>DRAM Bound</text><line x1='800' y1='373' x2='800' y2='396' stroke='#8e44ad' stroke-width='1.5'/><polygon points='800,396 795.4,388.3 804.6,388.3' fill='#8e44ad'/><rect x='30' y='400' width='540' height='140' rx='8' fill='#fbfcfe' fill-opacity='1.0' stroke='#3b6ea5' stroke-width='1.2'/><text x='50' y='425' font-size='12' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>怎么用：</text><text x='50' y='441' font-size='12' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>1. 先跑 perf stat -M TopdownL1 看四个大桶占比</text><text x='50' y='457' font-size='12' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>2. 哪个桶占比高，就沿树向下钻取（L2/L3 指标）</text><text x='50' y='473' font-size='12' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>3. 定位到叶节点后，查 perf-book 对应优化章节</text><text x='50' y='489' font-size='12' fill='#222' text-anchor='start' style='font-family:&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;'>实战命令：perf stat -M TopdownL1 ./app</text></svg>